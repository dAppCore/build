name: "Setup Go (and Wails)"
description: "Sets up Go with an optional cache, Garble when obfuscating, and the Wails v2 CLI when asked for"
inputs:
  go-version:
    description: "Go version to install"
    required: false
    default: "1.23"
  build-dependency-path:
    description: >
      Path to the file the Go cache keys on. A module in a subdirectory keeps
      its go.sum there, and a hardcoded root path meant the cache never hit.
    required: false
    default: "go.sum"
  build-cache:
    description: "Enable the Go build cache"
    required: false
    default: "true"
  build-obfuscate:
    description: "Build with Garble; installs it when true"
    required: false
    default: "false"
  wails-version:
    description: "Wails v2 CLI version to install"
    required: false
    default: "latest"
  wails-dev-build:
    description: "Legacy alias for install-wails: false. Kept so existing callers keep working."
    required: false
    default: "false"
  install-wails:
    description: >
      Install the Wails v2 CLI. False for a stack that has no use for it — a
      plain Go build, for instance, where pulling it costs a minute a run.
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    # Unconditional. This step used to be gated on wails-dev-build, so asking
    # not to install the Wails CLI also skipped installing Go — invisible on
    # Linux and Windows runners, which ship a Go, and a "go: command not found"
    # on macOS, which does not.
    - name: Setup GoLang
      uses: actions/setup-go@v7
      with:
        check-latest: true
        cache: ${{ inputs.build-cache }}
        cache-dependency-path: ${{ inputs.build-dependency-path }}
        go-version: ${{ inputs.go-version }}
    - name: Install Garble
      if: inputs.build-obfuscate == 'true'
      run: go install mvdan.cc/garble@latest
      shell: bash
    - run: go version
      shell: bash
    - name: Install Wails
      if: inputs.install-wails == 'true' && inputs.wails-dev-build == 'false'
      run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ inputs.wails-version }}
      shell: bash
