name: "Directory Orchestrator"
description: "Selects and delegates to a stack wrapper based on discovery outputs and ENV"
inputs:
  build:
    required: false
    default: "true"
    description: "Whether to run the build"
  sign:
    required: false
    default: "false"
    description: "Sign the build where signing is configured"
  package:
    required: false
    default: "true"
    description: "Upload artifacts, and publish a release on a tag"
  build-name:
    required: true
    description: "Base name for the binary, bundle and artifact"
  build-platform:
    required: false
    default: "darwin/universal"
    description: "Target platform, e.g. linux/amd64, windows/amd64, darwin/universal"
  app-working-directory:
    required: false
    default: "."
    description: "Root of the app being built"
  main-package:
    required: false
    default: ""
    description: "Package to build; empty auto-detects"
  build-tags:
    required: false
    default: ""
    description: "Comma-separated build tags"
  ldflags:
    required: false
    default: ""
    description: "Passed to -ldflags"
  cgo:
    required: false
    default: "auto"
    description: "auto, 0 or 1"
  test:
    required: false
    default: "auto"
    description: "auto runs tests when the module has any; true requires them; false skips"
  coverage:
    required: false
    default: "false"
    description: "Produce a coverage profile"
  codecov:
    required: false
    default: "false"
    description: "Upload coverage to Codecov. Implies coverage."
  codecov-token:
    required: false
    default: ""
    description: "Codecov token. Public repositories can upload without one."
  benchmarks:
    required: false
    default: "false"
    description: "Run benchmarks after the tests"
  release-asset-prefix:
    description: "Base name for release assets, before the -<os>-<arch> suffix"
    required: false
    default: ""
  go-directory:
    required: false
    default: ""
    description: "Where the Go module lives, relative to the working directory"
  # Orchestrator controls
  AUTO_STACK:
    required: false
    default: "true"
    description: "Let discovery choose the stack"
  AUTO_SETUP:
    required: false
    default: "true"
    description: "Let the environment toggles enable setup steps"
  STACK:
    required: false
    default: ""
    description: "Name a stack and skip detection"
  # Optional hint from a prior discovery step
  PRIMARY_STACK_SUGGESTION:
    required: false
    default: ""
    description: "Stack hint from an earlier discovery step"
runs:
  using: "composite"
  steps:
    - name: Resolve stack selection
      id: sel
      shell: bash
      env:
        AUTO_STACK: ${{ inputs.AUTO_STACK }}
        FORCED_STACK: ${{ inputs.STACK }}
        HINT: ${{ inputs.PRIMARY_STACK_SUGGESTION }}
      run: |
        set -euo pipefail
        sel_stack="wails2"
        if [ -n "${FORCED_STACK:-}" ]; then
          sel_stack="$FORCED_STACK"
          echo "[DEBUG_LOG] (orchestrator) Forced stack via input STACK=$sel_stack"
        elif [ "${AUTO_STACK:-true}" = "true" ] || [ "${AUTO_STACK:-true}" = "1" ]; then
          if [ -n "${HINT:-}" ] && [ "$HINT" != "unknown" ]; then
            sel_stack="$HINT"
            echo "[DEBUG_LOG] (orchestrator) Auto stack=${sel_stack} (from discovery hint)"
          else
            echo "[DEBUG_LOG] (orchestrator) No hint; defaulting to wails2"
          fi
        else
          echo "[DEBUG_LOG] (orchestrator) AUTO_STACK disabled; defaulting to wails2"
        fi
        # A stack nobody routes builds nothing and reports success, which is
        # worse than failing. Every value that reaches here must have a wrapper
        # below; this catches the gap at the point it is introduced.
        case "$sel_stack" in
          wails2|wails3|go|cpp|core|node|bun|deno) ;;
          *)
            echo "::error::no wrapper for stack '$sel_stack' — nothing would be built"
            exit 1
            ;;
        esac
        echo "SELECTED_STACK=$sel_stack" >> "$GITHUB_OUTPUT"

    - name: Call Wails v2 wrapper
      id: w2
      if: steps.sel.outputs.SELECTED_STACK == 'wails2'
      uses: dAppCore/build/actions/build/wails2@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        build-platform: ${{ inputs.build-platform }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    # v3 takes no build-platform: the project's Taskfile owns the target, and
    # the runner decides which one. Passing a platform here would offer a
    # choice the stack cannot honour.
    - name: Call Wails v3 wrapper
      id: w3
      if: steps.sel.outputs.SELECTED_STACK == 'wails3'
      uses: dAppCore/build/actions/build/wails3@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    - name: Call Go wrapper
      id: go
      if: steps.sel.outputs.SELECTED_STACK == 'go'
      uses: dAppCore/build/actions/build/go@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        build-platform: ${{ inputs.build-platform }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}
        go-directory: ${{ inputs.go-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}
        main-package: ${{ inputs.main-package }}
        build-tags: ${{ inputs.build-tags }}
        ldflags: ${{ inputs.ldflags }}
        cgo: ${{ inputs.cgo }}
        test: ${{ inputs.test }}
        coverage: ${{ inputs.coverage }}
        codecov: ${{ inputs.codecov }}
        codecov-token: ${{ inputs.codecov-token }}
        benchmarks: ${{ inputs.benchmarks }}

    # cpp takes no build-platform for the same reason v3 does not: the
    # conanfile's profile and layout decide the target, and the runner decides
    # which one it can produce.
    - name: Call C++ wrapper
      id: cpp
      if: steps.sel.outputs.SELECTED_STACK == 'cpp'
      uses: dAppCore/build/actions/build/cpp@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    - name: Call Node wrapper
      id: node
      if: steps.sel.outputs.SELECTED_STACK == 'node'
      uses: dAppCore/build/actions/build/node@v4
      with:
        build: ${{ inputs.build }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    - name: Call Bun wrapper
      id: bun
      if: steps.sel.outputs.SELECTED_STACK == 'bun'
      uses: dAppCore/build/actions/build/bun@v4
      with:
        build: ${{ inputs.build }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    - name: Call Deno wrapper
      id: deno
      if: steps.sel.outputs.SELECTED_STACK == 'deno'
      uses: dAppCore/build/actions/build/deno@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}

    # core is a library pipeline, not a builder — vet, test, lint, vulncheck.
    # It produces no artifact, so `build-name` and `package` do not reach it and
    # a `core` build uploads nothing. That is the stack behaving correctly, not
    # a packaging failure.
    - name: Call Core Go wrapper
      id: core
      if: steps.sel.outputs.SELECTED_STACK == 'core'
      uses: dAppCore/build/actions/build/core@v4
      with:
        app-working-directory: ${{ inputs.app-working-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}
        go-directory: ${{ inputs.go-directory }}
        release-asset-prefix: ${{ inputs.release-asset-prefix }}
outputs:
  SELECTED_STACK:
    description: "Stack selected by the orchestrator"
    value: ${{ steps.sel.outputs.SELECTED_STACK }}
  # Only one wrapper runs, so at most one of these is non-empty. Surfaced here
  # because a caller wants to know where the thing it asked for ended up, and
  # the orchestrator is the only step that knows which wrapper answered.
  BINARY_PATH:
    description: "Path to the built binary, for stacks that produce one"
    value: ${{ steps.go.outputs.BINARY_PATH || steps.cpp.outputs.BINARY_PATH || steps.deno.outputs.BINARY_PATH }}
  OUTPUT_PATH:
    description: "Directory the build wrote, for stacks that produce one"
    value: ${{ steps.node.outputs.OUTPUT_PATH || steps.bun.outputs.OUTPUT_PATH }}
