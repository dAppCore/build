name: "Build Wails v3 App"
description: >
  Builds or packages a Wails v3 application through the wails3 CLI and
  normalises the executable bits per OS.

  Wails v3 is not v2 with a new flag set — there are no build flags to compose,
  because a v3 project describes its own build. But the CLI still owns the
  verbs: `wails3 build` and `wails3 package`. Both dispatch to the project's
  build description internally, which is Wails' business rather than this
  action's, so this runs the verb and lets Wails decide what it means. CI and a
  developer's machine then take the same path through the same tool.

inputs:
  build:
    description: "Whether to run the build"
    required: false
    default: "true"
  app-working-directory:
    description: "Root of the app being built"
    required: false
    default: "."
  build-name:
    description: "Binary or bundle name, used to locate the output"
    required: true
  wails3-command:
    description: >
      Which wails3 CLI verb to run: `build` for the bare binary, `package` for
      the platform's installable artefact — the .app bundle, the NSIS
      installer, the Linux packages.
    required: false
    default: "build"
  wails3-tool:
    description: >
      How to invoke wails3. Defaults to `go tool wails3`, which resolves the
      version pinned by the project's own go.mod tool directive rather than
      whatever a global install happens to be. Set to `wails3` to use a CLI on
      PATH instead.
    required: false
    default: "go tool wails3"

outputs:
  WAILS3_COMMAND:
    description: "The wails3 verb that was executed"
    value: ${{ steps.verb.outputs.COMMAND }}

runs:
  using: "composite"
  steps:
    # Only the two verbs. Anything else would reach the CLI as a subcommand it
    # does not have, and the failure would name wails3 rather than the caller
    # that asked for it.
    - name: Resolve the wails3 verb
      id: verb
      shell: bash
      env:
        REQUESTED: ${{ inputs.wails3-command }}
      run: |
        set -euo pipefail
        COMMAND="${REQUESTED:-build}"
        case "$COMMAND" in
          build|package) ;;
          *)
            echo "::error::wails3-command must be 'build' or 'package', got '$COMMAND'"
            exit 1
            ;;
        esac
        echo "COMMAND=$COMMAND" >> "$GITHUB_OUTPUT"
        echo "[DEBUG_LOG] (wails3) command=$COMMAND"

    # A project that pins wails3 with a go.mod tool directive builds with the
    # version it was tested against. Falling back to an install is for projects
    # that have not adopted the directive; saying which happened matters when a
    # build behaves differently from a developer's machine.
    - name: Ensure the wails3 CLI is available
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        TOOL: ${{ inputs.wails3-tool }}
      run: |
        set -euo pipefail
        if [ "$TOOL" = "go tool wails3" ]; then
          if grep -qE '^tool .*wails/v3/cmd/wails3' go/go.mod 2>/dev/null \
          || grep -qE '^tool .*wails/v3/cmd/wails3' go.mod 2>/dev/null; then
            echo "[DEBUG_LOG] (wails3) using the module-pinned CLI"
            exit 0
          fi
          echo "::warning::no go.mod tool directive for wails3; installing the CLI"
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
        fi

    - name: Build
      if: inputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      run: ${{ inputs.wails3-tool }} ${{ steps.verb.outputs.COMMAND }}

    # wails3 writes to bin/. The bundle layout differs per platform, so the
    # executable bit is set where each platform actually keeps the binary.
    - name: Normalise macOS permissions
      if: inputs.build == 'true' && runner.os == 'macOS'
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      run: |
        set -euo pipefail
        chmod +x bin/*.app/Contents/MacOS/* 2>/dev/null || true
        [ -f "bin/${{ inputs.build-name }}" ] && chmod +x "bin/${{ inputs.build-name }}" || true

    - name: Normalise Linux permissions
      if: inputs.build == 'true' && runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      run: |
        set -euo pipefail
        find bin -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true
