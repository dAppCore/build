name: "Core Go (library pipeline)"
description: "Build and test Go library packages from the Core ecosystem. No binary output — validates code quality, runs tests, checks conventions."
inputs:
  app-working-directory:
    description: "Root of the project"
    required: false
    default: "."
  go-directory:
    description: >
      Where the module lives, relative to the working directory. A module one
      level down is a normal layout — this action used to run from the
      repository root unconditionally and could not see one.

      Left empty it is detected: the working directory when that holds the
      go.mod, otherwise go/. Every repo in this ecosystem except core/go keeps
      its module in go/, so an empty value used to mean the repo root and every
      one of them answered "go: no modules specified".
    required: false
    default: ""
  go-version:
    description: "Go version"
    required: false
    default: "1.26"
  run-vet:
    description: "Run go vet"
    required: false
    default: "true"
  run-lint:
    description: "Run golangci-lint"
    required: false
    default: "false"
  run-vuln:
    description: "Run govulncheck"
    required: false
    default: "false"
  run-race:
    description: "Run tests with -race"
    required: false
    default: "false"
  coverage-threshold:
    description: "Minimum coverage percentage (0 to skip)"
    required: false
    default: "0"
outputs:
  TESTS_PASSED:
    description: "1 if all tests passed"
    value: ${{ steps.test.outputs.PASSED }}
  COVERAGE:
    description: "Test coverage percentage"
    value: ${{ steps.test.outputs.COVERAGE }}
  VET_PASSED:
    description: "1 if go vet passed"
    value: ${{ steps.vet.outputs.PASSED }}
runs:
  using: "composite"
  steps:
    # Resolved before Setup Go, since the cache key needs the module path too,
    # and reused by every step after. Refuses rather than guessing: a module it
    # cannot find used to surface later as "no modules specified", which names
    # neither the directory searched nor the reason.
    - name: Resolve module directory
      id: module
      shell: bash
      run: |
        ROOT='${{ inputs.app-working-directory }}'
        GIVEN='${{ inputs.go-directory }}'

        if [ -n "$GIVEN" ]; then
          DIR="$ROOT/$GIVEN"
          if [ ! -f "$DIR/go.mod" ]; then
            echo "[core] go-directory '$GIVEN' holds no go.mod (looked in $DIR)" >&2
            exit 1
          fi
        elif [ -f "$ROOT/go.mod" ]; then
          DIR="$ROOT"
        elif [ -f "$ROOT/go/go.mod" ]; then
          DIR="$ROOT/go"
        else
          echo "[core] no go.mod in $ROOT or $ROOT/go — pass go-directory" >&2
          exit 1
        fi

        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        echo "[core] module: $DIR ($(head -1 "$DIR/go.mod"))"

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        # Keyed on the module's own go.sum, wherever it lives. Nicola made the
        # same point in #48 about the wails2 path.
        cache-dependency-path: ${{ steps.module.outputs.dir }}/go.sum

    - name: Download dependencies
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      run: |
        GOWORK=off go mod download
        echo "[core] Dependencies downloaded"

    - name: Build
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      run: |
        GOWORK=off go build ./...
        echo "[core] Build passed"

    - name: Vet
      id: vet
      if: inputs.run-vet == 'true'
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      run: |
        if GOWORK=off go vet ./... 2>&1; then
          echo "PASSED=1" >> "$GITHUB_OUTPUT"
          echo "[core] Vet passed"
        else
          echo "PASSED=0" >> "$GITHUB_OUTPUT"
          echo "[core] Vet found issues"
          exit 1
        fi

    - name: Test
      id: test
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      run: |
        RACE_FLAG=""
        if [ "${{ inputs.run-race }}" = "true" ]; then
          RACE_FLAG="-race"
        fi

        # Run tests with coverage.
        #
        # `set +e` is load-bearing: composite steps run under `bash -e`, so a
        # failing `go test` aborted the step on the line below and took every
        # line after it with it — the PASSED=0 output, the coverage extraction
        # and the coverage-threshold gate were all unreachable, and the
        # TEST_EXIT below only ever read the 0 of a run that had succeeded.
        set +e
        GOWORK=off go test ./... -count=1 -timeout 120s $RACE_FLAG -coverprofile=coverage.out 2>&1
        TEST_EXIT=$?
        set -e

        if [ $TEST_EXIT -eq 0 ]; then
          echo "PASSED=1" >> "$GITHUB_OUTPUT"
          echo "[core] Tests passed"
        else
          echo "PASSED=0" >> "$GITHUB_OUTPUT"
          echo "[core] Tests failed"
        fi

        # Extract coverage
        if [ -f coverage.out ]; then
          COV=$(GOWORK=off go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "COVERAGE=$COV" >> "$GITHUB_OUTPUT"
          echo "[core] Coverage: ${COV}%"

          # Check threshold
          THRESHOLD="${{ inputs.coverage-threshold }}"
          if [ "$THRESHOLD" != "0" ] && [ -n "$COV" ]; then
            if [ "$(echo "$COV < $THRESHOLD" | bc -l)" = "1" ]; then
              echo "[core] Coverage ${COV}% below threshold ${THRESHOLD}%"
              exit 1
            fi
          fi
        fi

        exit $TEST_EXIT

    # Installed rather than skipped-if-absent. The runner image does not ship
    # golangci-lint, so "not installed, skipping" meant a caller that asked for
    # lint got a passing step which had linted nothing — the one answer a gate
    # must never give. GOTOOLCHAIN=auto for the same reason as govulncheck below.
    - name: Lint
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      env:
        GOTOOLCHAIN: auto
      run: |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        fi
        GOWORK=off golangci-lint run ./...

    - name: Vulnerability check
      if: inputs.run-vuln == 'true'
      shell: bash
      working-directory: ${{ steps.module.outputs.dir }}
      # GOTOOLCHAIN=auto covers only the install. setup-go v6 pins it to local,
      # which makes the project's Go version govern what a tool may be built
      # with — and govulncheck@latest tracks the current Go, so any project a
      # release or two behind stops being able to install it. govulncheck then
      # runs against the project's own toolchain as before.
      env:
        GOTOOLCHAIN: auto
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        GOWORK=off govulncheck ./...
