name: "Next.js (Node)"
description: >
  Next writes .next for a server build and out for a static export, and which
  one you get depends on the config rather than the command. Both are
  candidates; the one the build created wins.

inputs:
  build:
    description: "Whether to run the build"
    required: false
    default: "true"
  app-working-directory:
    description: "Directory holding package.json"
    required: false
    default: "."
  build-script:
    description: "npm script to run"
    required: false
    default: "build"
  build-args:
    description: "Extra arguments passed after --"
    required: false
    default: ""
  output-directory:
    description: "Override the framework's usual output directory"
    required: false
    default: ""
  install:
    description: "Run npm ci before building"
    required: false
    default: "true"

outputs:
  OUTPUT_PATH:
    description: "Directory the build wrote, relative to the working directory"
    value: ${{ steps.build.outputs.OUTPUT_PATH }}

runs:
  using: "composite"
  steps:
    - name: Build
      id: build
      uses: dAppCore/build/actions/build/node/build@v4
      with:
        build: ${{ inputs.build }}
        app-working-directory: ${{ inputs.app-working-directory }}
        build-script: ${{ inputs.build-script }}
        build-args: ${{ inputs.build-args }}
        install: ${{ inputs.install }}
        output-directory: ${{ inputs.output-directory }}
        output-candidates: ".next out dist"
