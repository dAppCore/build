name: "Astro (Node)"
description: >
  Astro builds to dist by default and honours outDir in astro.config. The site
  and base values live in that config rather than on the command line, so this
  adapter stays thin on purpose.

inputs:
  build:
    description: "Whether to run the build"
    required: false
    default: "true"
  app-working-directory:
    description: "Directory holding package.json"
    required: false
    default: "."
  build-script:
    description: "npm script to run"
    required: false
    default: "build"
  build-args:
    description: "Extra arguments passed after --"
    required: false
    default: ""
  output-directory:
    description: "Override the framework's usual output directory"
    required: false
    default: ""
  install:
    description: "Install dependencies before building"
    required: false
    default: "true"
  package-manager:
    description: "npm, pnpm or yarn. `auto` reads the lockfile."
    required: false
    default: "auto"

outputs:
  PACKAGE_MANAGER:
    description: "The package manager that ran"
    value: ${{ steps.build.outputs.PACKAGE_MANAGER }}
  OUTPUT_PATH:
    description: "Directory the build wrote, relative to the working directory"
    value: ${{ steps.build.outputs.OUTPUT_PATH }}

runs:
  using: "composite"
  steps:
    - name: Build
      id: build
      uses: dAppCore/build/actions/build/node/build@v4
      with:
        build: ${{ inputs.build }}
        app-working-directory: ${{ inputs.app-working-directory }}
        build-script: ${{ inputs.build-script }}
        build-args: ${{ inputs.build-args }}
        install: ${{ inputs.install }}
        package-manager: ${{ inputs.package-manager }}
        output-directory: ${{ inputs.output-directory }}
        output-candidates: "dist"
