name: "Sign"
description: "Unified signing for macOS and Windows (conditional by OS); notarizes on tags for macOS"
inputs:
  sign:
    description: "Sign the build where signing is configured"
    required: false
    default: "false"
  app-working-directory:
    description: "Root of the app being built"
    required: false
    default: "."
  build-name:
    description: "Base name for the binary, bundle and artifact"
    required: true
  # macOS
  sign-macos-apple-password:
    description: "App-specific Apple ID password used for notarisation"
    required: false
    default: ''
  sign-macos-app-id:
    description: "Developer ID Application identity, e.g. 'Developer ID Application: Name (TEAMID)'"
    required: false
    default: ''
  sign-macos-app-cert:
    description: "Base64-encoded .p12 application signing certificate"
    required: false
    default: ''
  sign-macos-app-cert-password:
    description: "Password for the application certificate"
    required: false
    default: ''
  sign-macos-installer-id:
    description: "Developer ID Installer identity; empty builds an unsigned .pkg"
    required: false
    default: ''
  sign-macos-installer-cert:
    description: "Base64-encoded .p12 installer signing certificate"
    required: false
    default: ''
  sign-macos-installer-cert-password:
    description: "Password for the installer certificate"
    required: false
    default: ''
  # Windows
  notarize:
    description: >
      Notarise with xcrun notarytool instead of gon. gon has been unmaintained
      since 2022 and notarytool is Apple's supported path; this will become the
      default once callers have moved. Needs the Apple ID, team ID and an
      app-specific password.
    required: false
    default: "false"
  sign-macos-app-email:
    description: "Apple ID email, for notarytool"
    required: false
    default: ""
  sign-macos-app-team-id:
    description: "Apple Developer team ID, for notarytool"
    required: false
    default: ""
  dmg:
    description: "Build a .dmg with create-dmg, and notarise that rather than the .pkg"
    required: false
    default: "false"
  dmg-background:
    description: "Background image for the DMG window, relative to the working directory"
    required: false
    default: "build/darwin/installer_background.png"
  sign-sparkle:
    description: >
      Codesign a bundled Sparkle framework. Sparkle ships XPC services and
      helper apps that must each be signed separately, and a bundle where they
      are not is rejected at notarisation rather than at signing.
    required: false
    default: "false"
  sign-windows-cert:
    description: "Base64-encoded .pfx signing certificate; empty skips Windows signing"
    required: false
    default: ''
  sign-windows-cert-password:
    description: "Password for the Windows certificate"
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # macOS signing flow
    - name: Import Code-Signing Certificates for macOS
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v1
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-app-cert }}
        p12-password: ${{ inputs.sign-macos-app-cert-password }}
    - name: Import Code-Signing Certificates for macOS Installer
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v1
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-installer-cert }}
        p12-password: ${{ inputs.sign-macos-installer-cert-password }}
        create-keychain: false
    - name: Sign macOS .app with gon
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
      run: |
        echo "Signing Package"
        gon -log-level=info ./build/darwin/gon-sign.json
    - name: Build .app zip file
      if: runner.os == 'macOS'
      working-directory: ${{ inputs.app-working-directory }}
      shell: bash
      run: |
        # Paths are relative to working-directory, which is already
        # app-working-directory — prefixing again asked ditto for
        # <dir>/<dir>/build/bin. harrys522 spotted this in #46.
        ditto -c -k --keepParent build/bin/${{ inputs.build-name }}.app build/bin/${{ inputs.build-name }}.app.zip
    - name: Build Installer (signed)
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-installer-id != '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      run: |
        productbuild --sign '${{ inputs.sign-macos-installer-id }}' --component build/bin/${{ inputs.build-name }}.app /Applications build/bin/${{ inputs.build-name }}.pkg
    - name: Build Installer (unsigned)
      if: runner.os == 'macOS' && inputs.sign-macos-installer-id == '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      run: |
        productbuild --component build/bin/${{ inputs.build-name }}.app /Applications build/bin/${{ inputs.build-name }}.pkg
    - name: Notarize Installer and zip with gon
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.notarize != 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
      run: |
        gon -log-level=info build/darwin/gon-notarize.json

    # Sparkle ships XPC services and helper apps inside its framework, and each
    # has to be signed on its own — the outer signature does not cover them.
    # A bundle missing these passes codesign and fails notarisation, which is
    # a slow way to find out. Contributed by Andrew Krueger in #42.
    - name: Sign the Sparkle framework
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-sparkle == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        IDENTITY: ${{ inputs.sign-macos-app-id }}
        NAME: ${{ inputs.build-name }}
      run: |
        set -euo pipefail
        FRAMEWORK="bin/$NAME.app/Contents/Frameworks/Sparkle.framework"
        if [ ! -d "$FRAMEWORK" ]; then
          echo "::error::sign-sparkle is on but $FRAMEWORK does not exist"
          exit 1
        fi
        V="$FRAMEWORK/Versions/B"
        codesign -f -s "$IDENTITY" -o runtime "$V/XPCServices/Installer.xpc"
        codesign -f -s "$IDENTITY" -o runtime --preserve-metadata=entitlements "$V/XPCServices/Downloader.xpc"
        codesign -f -s "$IDENTITY" -o runtime "$V/Autoupdate"
        codesign -f -s "$IDENTITY" -o runtime "$V/Updater.app"
        codesign -f -s "$IDENTITY" -o runtime "$FRAMEWORK"
        codesign -f -s "$IDENTITY" --timestamp --entitlements build/darwin/entitlements.plist -o runtime "bin/$NAME.app"

    - name: Build a DMG
      if: runner.os == 'macOS' && inputs.dmg == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        NAME: ${{ inputs.build-name }}
        BACKGROUND: ${{ inputs.dmg-background }}
      run: |
        set -euo pipefail
        command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

        # The loose binary sits beside the .app and would otherwise be dragged
        # into the DMG next to it, which looks like a mistake to a user.
        rm -f "bin/$NAME"

        args=(--volname "$NAME" --window-pos 200 120 --window-size 800 400
              --icon-size 100 --icon "$NAME.app" 200 190
              --hide-extension "$NAME.app" --app-drop-link 600 185)
        if [ -f "$BACKGROUND" ]; then args+=(--background "$BACKGROUND"); fi

        create-dmg "${args[@]}" "$NAME.dmg" "bin/"
        mv "$NAME.dmg" bin/

    - name: Notarise and staple with notarytool
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.notarize == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APPLE_ID: ${{ inputs.sign-macos-app-email }}
        TEAM_ID: ${{ inputs.sign-macos-app-team-id }}
        APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
        NAME: ${{ inputs.build-name }}
        DMG: ${{ inputs.dmg }}
      run: |
        set -euo pipefail
        for v in APPLE_ID TEAM_ID APPLE_PASSWORD; do
          if [ -z "${!v}" ]; then echo "::error::notarize is on but $v is empty"; exit 1; fi
        done

        if [ "$DMG" = "true" ]; then TARGET="bin/$NAME.dmg"; else TARGET="bin/$NAME.pkg"; fi
        test -f "$TARGET"

        xcrun notarytool submit "$TARGET" \
          --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD" \
          --wait --timeout 30m
        # Stapling attaches the ticket so the app validates without a network
        # round trip on first launch.
        xcrun stapler staple "$TARGET"

    # Windows signing flow
    - name: Sign Windows binaries
      shell: powershell
      if: runner.os == 'Windows' && inputs.sign != 'false' && inputs.sign-windows-cert != ''
      working-directory: ${{ inputs.app-working-directory }}
      run: |
        echo "Creating certificate file"
        New-Item -ItemType directory -Path certificate
        Set-Content -Path certificate\certificate.txt -Value '${{ inputs.sign-windows-cert }}'
        certutil -decode certificate\certificate.txt certificate\certificate.pfx
        echo "Signing our binaries"
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p '${{ inputs.sign-windows-cert-password }}' .\build\bin\${{ inputs.build-name }}.exe
        echo "Signing Installer"
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p '${{ inputs.sign-windows-cert-password }}' .\build\bin\${{ inputs.build-name }}-amd64-installer.exe
