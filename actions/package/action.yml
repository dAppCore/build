name: "Package & Release"
description: "Uploads build artifacts and publishes GitHub Release on tag if enabled"
inputs:
  package:
    description: "Upload artifacts, and publish a release on a tag"
    required: false
    default: "true"
  build-name:
    description: "Base name for the binary, bundle and artifact"
    required: true
  os:
    description: "OS name (optional, from discovery). Defaults to runner.os"
    required: false
    default: ""
  arch:
    description: "Architecture (optional, from discovery). Defaults to detected arch"
    required: false
    default: ""
  tag:
    description: "Git tag (optional, from discovery)."
    required: false
    default: ""
  is-tag:
    description: "Whether the ref is a tag (optional, from discovery)."
    required: false
    default: ""
  short-sha:
    description: "Short commit SHA (optional, from discovery)."
    required: false
    default: ""
  ref:
    description: "Git ref (optional, from discovery)."
    required: false
    default: ""
  release-asset-prefix:
    description: >
      Base name for release assets, before the -<os>-<arch> suffix. Defaults to
      build-name. Assets are named without a version so that
      /releases/latest/download/<name> resolves, which is what makes a release
      usable as a download source rather than only as a record.
    required: false
    default: ""
  include-meta:
    description: "Include artifact_meta.json with discovery metadata in the uploaded artifact"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Compute artifact name
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        OS_IN="${{ inputs.os }}"
        ARCH_IN="${{ inputs.arch }}"
        TAG_IN="${{ inputs.tag }}"
        SHORT_SHA_IN="${{ inputs.short-sha }}"
        # Resolve OS
        if [ -z "$OS_IN" ]; then
          OS_IN="${{ runner.os }}"
        fi
        # Resolve ARCH (prefer input)
        if [ -z "$ARCH_IN" ]; then
          # Try uname -m; fallback to envs on Windows if needed
          if command -v uname >/dev/null 2>&1; then
            M=$(uname -m || echo unknown)
          else
            M="$PROCESSOR_ARCHITECTURE"
          fi
          case "$M" in
            x86_64|amd64) ARCH_IN="amd64";;
            aarch64|arm64) ARCH_IN="arm64";;
            armv7l) ARCH_IN="armv7";;
            *) ARCH_IN="$M";;
          esac
        fi
        # Resolve revision label (prefer tag)
        if [ -n "$TAG_IN" ]; then
          REV="$TAG_IN"
        else
          if [ -z "$SHORT_SHA_IN" ]; then
            GHS="${GITHUB_SHA:-}"
            SHORT_SHA_IN="${GHS:0:7}"
          fi
          REV="$SHORT_SHA_IN"
        fi
        NAME="${{ inputs.build-name }}_${OS_IN}_${ARCH_IN}_${REV}"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_OUTPUT"
    - name: Debug echo artifact name
      shell: bash
      run: |
        echo "[DEBUG_LOG] ARTIFACT_NAME=${{ steps.meta.outputs.ARTIFACT_NAME }}"
    - name: Write artifact_meta.json
      if: inputs.package == 'true' && inputs.include-meta == 'true'
      shell: bash
      env:
        IN_BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ inputs.os }}
        IN_ARCH: ${{ inputs.arch }}
        IN_REF: ${{ inputs.ref }}
        IN_TAG: ${{ inputs.tag }}
        IN_SHORT_SHA: ${{ inputs.short-sha }}
      run: |
        set -euo pipefail
        build_name="$IN_BUILD_NAME"
        os_val="$IN_OS"
        arch_val="$IN_ARCH"
        ref_val="$IN_REF"
        tag_val="$IN_TAG"
        short_sha="$IN_SHORT_SHA"
        # Resolve OS from runner if not provided
        if [ -z "$os_val" ]; then os_val="${RUNNER_OS:-}"; fi
        # Resolve ARCH if not provided (best-effort)
        if [ -z "$arch_val" ]; then
          if command -v uname >/dev/null 2>&1; then
            m=$(uname -m || echo unknown)
            case "$m" in
              x86_64|amd64) arch_val="amd64";;
              aarch64|arm64) arch_val="arm64";;
              armv7l) arch_val="armv7";;
              *) arch_val="$m";;
            esac
          else
            arch_val="${PROCESSOR_ARCHITECTURE:-}"
          fi
        fi
        # Resolve REF/BRANCH
        if [ -z "$ref_val" ]; then ref_val="${GITHUB_REF:-}"; fi
        branch_val=""
        case "$ref_val" in
          refs/heads/*) branch_val="${ref_val#refs/heads/}" ;;
        esac
        # Resolve SHORT SHA
        if [ -z "$short_sha" ]; then
          ghsha="${GITHUB_SHA:-}"
          short_sha="${ghsha:0:7}"
        fi
        cat > artifact_meta.json <<JSON
        {
          "build_name": "${build_name}",
          "os": "${os_val}",
          "arch": "${arch_val}",
          "ref": "${ref_val}",
          "branch": "${branch_val}",
          "tag": "${tag_val}",
          "short_sha": "${short_sha}"
        }
        JSON
        echo "[DEBUG_LOG] Wrote artifact_meta.json"
    - uses: actions/upload-artifact@v4
      if: inputs.package == 'true'
      with:
        overwrite: 'true'
        name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
        path: |
          # ** rather than *: an app one directory down (app-working-directory)
          # puts its bin/ two levels deep, and a single-level glob missed it —
          # so the artifact uploaded empty. Reported by Arthur in #49.
          **/bin/
          *\bin\*
          artifact_meta.json
    # Release assets need names that are unique across platforms and stable
    # across versions. The raw file is called `core` on Linux and macOS alike,
    # so all three jobs uploaded an asset with the same name and clobbered each
    # other; and a name containing the version cannot be fetched from
    # /releases/latest/download/<name>, which is the whole point of publishing
    # one. So each binary is staged as <prefix>-<os>-<arch><ext> first.
    - name: Stage release assets
      id: assets
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        PREFIX: ${{ inputs.release-asset-prefix }}
        BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ inputs.os }}
        IN_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        prefix="${PREFIX:-$BUILD_NAME}"

        # GOOS names rather than the runner's: a script choosing what to
        # download computes them from uname, and darwin is what it gets.
        case "$(printf '%s' "${IN_OS:-$RUNNER_OS}" | tr '[:upper:]' '[:lower:]')" in
          *mac*|*darwin*) os=darwin ;;
          *win*)          os=windows ;;
          *linux*)        os=linux ;;
          *)              os="$(printf '%s' "${IN_OS:-unknown}" | tr '[:upper:]' '[:lower:]')" ;;
        esac
        arch="${IN_ARCH:-amd64}"

        # One zip per platform, named <prefix>-<os>-<arch>.zip, holding the
        # binary under its own name. A download stays predictable and an
        # extraction gives you `core` — not `core-linux-amd64`, which is a name
        # nobody wants to type or put on PATH.
        rm -rf .release-assets .release-staging
        mkdir -p .release-assets .release-staging

        staged=0
        while IFS= read -r f; do
          [ -f "$f" ] || continue
          case "$f" in *.json) continue ;; esac
          cp "$f" ".release-staging/${f##*/}"
          staged=$((staged+1))
        done < <(find . -path '*/bin/*' -type f \
                   -not -path './.release-assets/*' -not -path './.release-staging/*' 2>/dev/null)

        if [ "$staged" -eq 0 ]; then
          echo "::warning::no files under */bin/ to release"
          echo "ASSET=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        asset="${prefix}-${os}-${arch}.zip"
        out="$PWD/.release-assets/$asset"

        # zip is the tool. It is on every Linux and macOS runner and it keeps
        # the executable bit — an archive that unpacks to a non-executable file
        # fails at the first thing anyone does with it.
        #
        # Where it is absent, which is Windows, PowerShell's Compress-Archive
        # is the fallback: it ships with the OS and needs no install. 7z is
        # deliberately not used — assuming it is present is exactly the kind of
        # dependency a packaging step should not add.
        if command -v zip >/dev/null 2>&1; then
          ( cd .release-staging && zip -q -X "$out" ./* )
        elif command -v pwsh >/dev/null 2>&1 || command -v powershell >/dev/null 2>&1; then
          PS_BIN=pwsh
          command -v pwsh >/dev/null 2>&1 || PS_BIN=powershell
          "$PS_BIN" -NoProfile -Command "Compress-Archive -Path '.release-staging/*' -DestinationPath '$out' -Force"
        else
          echo "::error::no zip and no PowerShell available to package the release"
          exit 1
        fi

        test -f "$out"

        rm -rf .release-staging
        echo "[DEBUG_LOG] $staged file(s) into $asset"
        echo "ASSET=$asset" >> "$GITHUB_OUTPUT"
        ls -la .release-assets

    - name: Release
      uses: softprops/action-gh-release@v1
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      with:
        # The tag names the release. It used to be the artifact name, so
        # whichever platform's job finished first decided the release title.
        name: ${{ inputs.tag }}
        files: .release-assets/*
