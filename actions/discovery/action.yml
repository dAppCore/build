name: "Discovery"
description: "Detect OS/ARCH and (on Linux) distro; install required packages; expose repo/ref metadata; detect project markers (root and subtree)"
inputs:
  working-directory:
    description: "Directory to scan for project markers (root of the app)"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Linux discovery and deps
      if: runner.os == 'Linux'
      id: linux
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        tries=0
        until sudo apt-get -yq update; do
          tries=$((tries+1))
          if [ $tries -ge 3 ]; then echo "apt-get update failed after $tries attempts"; exit 1; fi
          echo "Retrying apt-get update ($tries)"; sleep 2
        done
        DISTRO=$(lsb_release -rs)
        if [[ "$DISTRO" == "20.04" ]]; then
          sudo apt-get -yq install libgtk-3-0 libwebkit2gtk-4.0-dev gcc-aarch64-linux-gnu
        elif [[ "$DISTRO" == "22.04" ]]; then
          sudo apt-get -yq install libgtk-3-0 libwebkit2gtk-4.0-dev gcc-aarch64-linux-gnu
        elif [[ "$DISTRO" == "24.04" ]]; then
          sudo apt-get -yq install libgtk-3-0 libwebkit2gtk-4.1-dev gcc-aarch64-linux-gnu
        else
          echo "Unsupported Linux distribution: $DISTRO"
          exit 1
        fi
        echo "DISTRO=$DISTRO" >> "$GITHUB_OUTPUT"
    - name: Common metadata (bash)
      if: runner.os != 'Windows'
      id: meta_bash
      shell: bash
      run: |
        set -euo pipefail
        OS="${{ runner.os }}"
        M="$(uname -m)"
        case "$M" in
          x86_64|amd64) ARCH="amd64";;
          aarch64|arm64) ARCH="arm64";;
          armv7l) ARCH="armv7";;
          *) ARCH="$M";;
        esac
        REF="${{ github.ref }}"
        BRANCH=""
        if [[ "$REF" == refs/heads/* ]]; then
          BRANCH="${REF#refs/heads/}"
        fi
        SHA="${{ github.sha }}"
        SHORT_SHA="${SHA::7}"
        REPO="${{ github.repository }}"
        OWNER="${{ github.repository_owner }}"
        TAG=""
        IS_TAG=0
        if [[ "$REF" == refs/tags/* ]]; then
          IS_TAG=1
          TAG="${REF#refs/tags/}"
        fi
        echo "OS=$OS" >> "$GITHUB_OUTPUT"
        echo "ARCH=$ARCH" >> "$GITHUB_OUTPUT"
        echo "REF=$REF" >> "$GITHUB_OUTPUT"
        echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
        echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
        echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
        echo "OWNER=$OWNER" >> "$GITHUB_OUTPUT"
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
        echo "IS_TAG=$IS_TAG" >> "$GITHUB_OUTPUT"
    - name: Common metadata (powershell)
      if: runner.os == 'Windows'
      id: meta_pwsh
      shell: powershell
      run: |
        $OS = "${{ runner.os }}"
        $archEnv = $Env:PROCESSOR_ARCHITECTURE
        if ($archEnv -eq "AMD64") { $ARCH = "amd64" }
        elseif ($archEnv -eq "ARM64") { $ARCH = "arm64" }
        else { $ARCH = $archEnv }
        $REF = "${{ github.ref }}"
        $BRANCH = ""
        if ($REF.StartsWith("refs/heads/")) { $BRANCH = $REF.Substring(11) }
        $SHA = "${{ github.sha }}"
        $SHORT_SHA = $SHA.Substring(0,7)
        $REPO = "${{ github.repository }}"
        $OWNER = "${{ github.repository_owner }}"
        $TAG = ""
        $IS_TAG = 0
        if ($REF.StartsWith("refs/tags/")) {
          $IS_TAG = 1
          $TAG = $REF.Substring(10)
        }
        "OS=$OS" >> $Env:GITHUB_OUTPUT
        "ARCH=$ARCH" >> $Env:GITHUB_OUTPUT
        "REF=$REF" >> $Env:GITHUB_OUTPUT
        "BRANCH=$BRANCH" >> $Env:GITHUB_OUTPUT
        "SHA=$SHA" >> $Env:GITHUB_OUTPUT
        "SHORT_SHA=$SHORT_SHA" >> $Env:GITHUB_OUTPUT
        "REPO=$REPO" >> $Env:GITHUB_OUTPUT
        "OWNER=$OWNER" >> $Env:GITHUB_OUTPUT
        "TAG=$TAG" >> $Env:GITHUB_OUTPUT
        "IS_TAG=$IS_TAG" >> $Env:GITHUB_OUTPUT
    - name: Project markers (bash)
      if: runner.os != 'Windows'
      id: proj_bash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "[DEBUG_LOG] Discovery scanning working dir: $PWD"
        has_root_pkg=0; has_frontend_pkg=0; has_go_mod=0; has_main_go=0; has_cmake=0; has_mkdocs=0
        has_sub_npm=0; has_sub_mkdocs=0; has_wails_v3=0; go_mod_path=""
        found_files=()
        # Root markers
        if [ -f "package.json" ]; then has_root_pkg=1; found_files+=("package.json"); fi
        if [ -f "go.mod" ]; then has_go_mod=1; go_mod_path="go.mod"; found_files+=("go.mod"); fi
        # A Go module one level down is a normal layout, not an exception: the
        # module sits in go/ so the repository root can hold the frontend and
        # the build files. Missing it reads the project as "no Go at all".
        if [ "$has_go_mod" -eq 0 ] && [ -f "go/go.mod" ]; then
          has_go_mod=1; go_mod_path="go/go.mod"; found_files+=("go/go.mod")
        fi
        if [ -f "main.go" ]; then has_main_go=1; found_files+=("main.go"); fi
        if [ -f "CMakeLists.txt" ]; then has_cmake=1; found_files+=("CMakeLists.txt"); fi
        if [ -f "mkdocs.yml" ]; then has_mkdocs=1; found_files+=("mkdocs.yml"); fi
        # Common subtree markers
        if [ -f "frontend/package.json" ]; then has_frontend_pkg=1; found_files+=("frontend/package.json"); fi
        # Light subtree search up to depth 2 for package.json and mkdocs.yml
        if command -v find >/dev/null 2>&1; then
          if find . -maxdepth 2 -mindepth 2 -name package.json | grep -q .; then has_sub_npm=1; fi
          if find . -maxdepth 2 -mindepth 1 -name mkdocs.yml | grep -q .; then has_sub_mkdocs=1; fi
        fi
        # Wails v3 declares itself in the module. That is the only marker that
        # separates it from v2 without guessing: both are Go plus a frontend,
        # and the two build through entirely different tooling — v2 by CLI
        # flags, v3 by Taskfile targets.
        if [ -n "$go_mod_path" ] && grep -qE 'wails/v3' "$go_mod_path" 2>/dev/null; then
          has_wails_v3=1
        fi
        # The JavaScript runtime is decided by the lockfile, because that is the
        # one file that says which tool actually installed the tree. A
        # package.json is common to all three and settles nothing.
        js_runtime=""
        if [ -f "deno.json" ] || [ -f "deno.jsonc" ] || [ -f "deno.lock" ]; then
          js_runtime="deno"
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
          js_runtime="bun"
        elif [ "$has_root_pkg" -eq 1 ]; then
          js_runtime="node"
        fi

        # On Node the lockfile also says which package manager installed the
        # tree. Using the wrong one resolves a different tree from the one the
        # developer tested, so it is read rather than assumed.
        js_pm=""
        if [ "$js_runtime" = "node" ]; then
          if [ -f "pnpm-lock.yaml" ]; then js_pm="pnpm"
          elif [ -f "yarn.lock" ]; then js_pm="yarn"
          elif [ -f "package-lock.json" ]; then js_pm="npm"
          fi
        fi

        # The framework is a separate question from the runtime — the same
        # framework runs under more than one — so it is detected separately and
        # reported separately.
        js_framework=""
        if [ "$js_runtime" = "deno" ]; then
          # Deno frameworks declare themselves in the import map rather than in
          # a config file of their own.
          for c in deno.json deno.jsonc; do
            [ -f "$c" ] || continue
            if grep -q '@danet/core' "$c" 2>/dev/null; then js_framework="danet"; fi
            break
          done
        elif [ -n "$js_runtime" ]; then
          if [ -f "angular.json" ]; then js_framework="angular"
          elif ls astro.config.* >/dev/null 2>&1; then js_framework="astro"
          elif ls next.config.* >/dev/null 2>&1; then js_framework="next"
          elif ls nuxt.config.* >/dev/null 2>&1; then js_framework="nuxt"
          elif ls svelte.config.* >/dev/null 2>&1; then js_framework="svelte"
          elif ls vite.config.* >/dev/null 2>&1; then js_framework="vite"
          fi
        fi

        # A module that produces a command is a different job from a module that
        # is a library: one wants a binary and an artifact, the other wants vet
        # and tests. `main.go` at the root is the simple case; cmd/<name>/main.go
        # is the common one, and go/cmd/... the nested-module variant.
        has_go_main="$has_main_go"
        if [ "$has_go_main" -eq 0 ] && command -v find >/dev/null 2>&1; then
          if find cmd go/cmd -maxdepth 2 -name main.go 2>/dev/null | grep -q .; then
            has_go_main=1
          fi
        fi
        # Suggest stack
        suggestion="unknown"
        if { [ "$has_go_mod" -eq 1 ] || [ "$has_main_go" -eq 1 ]; } && { [ "$has_root_pkg" -eq 1 ] || [ "$has_frontend_pkg" -eq 1 ] || [ "$has_sub_npm" -eq 1 ]; }; then
          if [ "$has_wails_v3" -eq 1 ]; then suggestion="wails3"; else suggestion="wails2"; fi
        elif [ "$has_go_mod" -eq 1 ] && [ "$has_go_main" -eq 1 ]; then
          suggestion="go"
        elif [ "$has_go_mod" -eq 1 ]; then
          suggestion="core"
        elif [ "$has_cmake" -eq 1 ]; then
          suggestion="cpp"
        elif [ -n "$js_runtime" ]; then
          suggestion="$js_runtime"
        fi
        # Output and logs
        echo "[DEBUG_LOG] HAS_ROOT_PACKAGE_JSON=$has_root_pkg"
        echo "[DEBUG_LOG] HAS_FRONTEND_PACKAGE_JSON=$has_frontend_pkg"
        echo "[DEBUG_LOG] HAS_ROOT_GO_MOD=$has_go_mod"
        echo "[DEBUG_LOG] HAS_ROOT_MAIN_GO=$has_main_go"
        echo "[DEBUG_LOG] HAS_GO_MAIN_PACKAGE=$has_go_main"
        echo "[DEBUG_LOG] JS_RUNTIME=${js_runtime:-none}"
        echo "[DEBUG_LOG] JS_FRAMEWORK=${js_framework:-none}"
        echo "[DEBUG_LOG] JS_PACKAGE_MANAGER=${js_pm:-none}"
        echo "[DEBUG_LOG] HAS_ROOT_CMAKELISTS=$has_cmake"
        echo "[DEBUG_LOG] HAS_ROOT_MKDOCS=$has_mkdocs"
        echo "[DEBUG_LOG] HAS_SUB_NPM=$has_sub_npm"
        echo "[DEBUG_LOG] HAS_SUB_MKDOCS=$has_sub_mkdocs"
        echo "[DEBUG_LOG] HAS_WAILS_V3=$has_wails_v3 (go.mod: ${go_mod_path:-none})"
        echo "[DEBUG_LOG] PRIMARY_STACK_SUGGESTION=$suggestion"
        echo "HAS_ROOT_PACKAGE_JSON=$has_root_pkg" >> "$GITHUB_OUTPUT"
        echo "HAS_FRONTEND_PACKAGE_JSON=$has_frontend_pkg" >> "$GITHUB_OUTPUT"
        echo "HAS_ROOT_GO_MOD=$has_go_mod" >> "$GITHUB_OUTPUT"
        echo "HAS_ROOT_MAIN_GO=$has_main_go" >> "$GITHUB_OUTPUT"
        echo "HAS_GO_MAIN_PACKAGE=$has_go_main" >> "$GITHUB_OUTPUT"
        echo "JS_RUNTIME=$js_runtime" >> "$GITHUB_OUTPUT"
        echo "JS_FRAMEWORK=$js_framework" >> "$GITHUB_OUTPUT"
        echo "JS_PACKAGE_MANAGER=$js_pm" >> "$GITHUB_OUTPUT"
        echo "HAS_ROOT_CMAKELISTS=$has_cmake" >> "$GITHUB_OUTPUT"
        echo "HAS_ROOT_MKDOCS=$has_mkdocs" >> "$GITHUB_OUTPUT"
        echo "HAS_SUB_NPM=$has_sub_npm" >> "$GITHUB_OUTPUT"
        echo "HAS_SUB_MKDOCS=$has_sub_mkdocs" >> "$GITHUB_OUTPUT"
        echo "PRIMARY_STACK_SUGGESTION=$suggestion" >> "$GITHUB_OUTPUT"
        if [ ${#found_files[@]} -gt 0 ]; then
          IFS=,; echo "FOUND_FILES=${found_files[*]}" >> "$GITHUB_OUTPUT"; unset IFS
        else
          echo "FOUND_FILES=" >> "$GITHUB_OUTPUT"
        fi
    - name: Project markers (powershell)
      if: runner.os == 'Windows'
      id: proj_pwsh
      shell: powershell
      working-directory: ${{ inputs.working-directory }}
      run: |
        Write-Host "[DEBUG_LOG] Discovery scanning working dir: $PWD"
        $has_root_pkg=0; $has_frontend_pkg=0; $has_go_mod=0; $has_main_go=0; $has_cmake=0; $has_mkdocs=0
        $has_sub_npm=0; $has_sub_mkdocs=0; $has_wails_v3=0; $go_mod_path=""
        $found = @()
        if (Test-Path package.json) { $has_root_pkg=1; $found+="package.json" }
        if (Test-Path go.mod) { $has_go_mod=1; $go_mod_path="go.mod"; $found+="go.mod" }
        # A module one level down is a normal layout, not an exception.
        if (($has_go_mod -eq 0) -and (Test-Path go/go.mod)) { $has_go_mod=1; $go_mod_path="go/go.mod"; $found+="go/go.mod" }
        if (Test-Path main.go) { $has_main_go=1; $found+="main.go" }
        if (Test-Path CMakeLists.txt) { $has_cmake=1; $found+="CMakeLists.txt" }
        if (Test-Path mkdocs.yml) { $has_mkdocs=1; $found+="mkdocs.yml" }
        if (Test-Path frontend/package.json) { $has_frontend_pkg=1; $found+="frontend/package.json" }
        # Limited subtree search (depth ~2)
        Get-ChildItem -Recurse -Depth 2 -Filter package.json -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*node_modules*" } | ForEach-Object { $has_sub_npm=1 }
        Get-ChildItem -Recurse -Depth 2 -Filter mkdocs.yml -ErrorAction SilentlyContinue | ForEach-Object { $has_sub_mkdocs=1 }
        # Wails v3 declares itself in the module — the only marker that
        # separates it from v2 without guessing.
        if ($go_mod_path -ne "" -and (Select-String -Path $go_mod_path -Pattern 'wails/v3' -Quiet -ErrorAction SilentlyContinue)) { $has_wails_v3=1 }
        # Runtime from the lockfile; a package.json is common to all three.
        $js_runtime = ""
        if ((Test-Path deno.json) -or (Test-Path deno.jsonc) -or (Test-Path deno.lock)) { $js_runtime = "deno" }
        elseif ((Test-Path bun.lockb) -or (Test-Path bun.lock)) { $js_runtime = "bun" }
        elseif ($has_root_pkg -eq 1) { $js_runtime = "node" }

        # The lockfile also names the package manager on Node.
        $js_pm = ""
        if ($js_runtime -eq "node") {
          if (Test-Path pnpm-lock.yaml) { $js_pm = "pnpm" }
          elseif (Test-Path yarn.lock) { $js_pm = "yarn" }
          elseif (Test-Path package-lock.json) { $js_pm = "npm" }
        }

        # Framework is a separate axis from runtime.
        $js_framework = ""
        if ($js_runtime -eq "deno") {
          foreach ($c in @("deno.json","deno.jsonc")) {
            if (Test-Path $c) {
              if (Select-String -Path $c -Pattern '@danet/core' -Quiet -ErrorAction SilentlyContinue) { $js_framework = "danet" }
              break
            }
          }
        }
        elseif ($js_runtime -ne "") {
          if (Test-Path angular.json) { $js_framework = "angular" }
          elseif (Get-ChildItem -Filter "astro.config.*" -ErrorAction SilentlyContinue) { $js_framework = "astro" }
          elseif (Get-ChildItem -Filter "next.config.*" -ErrorAction SilentlyContinue) { $js_framework = "next" }
          elseif (Get-ChildItem -Filter "nuxt.config.*" -ErrorAction SilentlyContinue) { $js_framework = "nuxt" }
          elseif (Get-ChildItem -Filter "svelte.config.*" -ErrorAction SilentlyContinue) { $js_framework = "svelte" }
          elseif (Get-ChildItem -Filter "vite.config.*" -ErrorAction SilentlyContinue) { $js_framework = "vite" }
        }

        # A module producing a command is a different job from a library one.
        $has_go_main = $has_main_go
        if ($has_go_main -eq 0) {
          foreach ($dir in @("cmd", "go/cmd")) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Recurse -Depth 2 -Filter main.go -ErrorAction SilentlyContinue | ForEach-Object { $has_go_main = 1 }
            }
          }
        }
        $suggestion = "unknown"
        if ((($has_go_mod -eq 1) -or ($has_main_go -eq 1)) -and (($has_root_pkg -eq 1) -or ($has_frontend_pkg -eq 1) -or ($has_sub_npm -eq 1))) {
          if ($has_wails_v3 -eq 1) { $suggestion = "wails3" } else { $suggestion = "wails2" }
        }
        elseif (($has_go_mod -eq 1) -and ($has_go_main -eq 1)) { $suggestion = "go" }
        elseif ($has_go_mod -eq 1) { $suggestion = "core" }
        elseif ($has_cmake -eq 1) { $suggestion = "cpp" }
        elseif ($js_runtime -ne "") { $suggestion = $js_runtime }
        Write-Host "[DEBUG_LOG] HAS_ROOT_PACKAGE_JSON=$has_root_pkg"
        Write-Host "[DEBUG_LOG] HAS_FRONTEND_PACKAGE_JSON=$has_frontend_pkg"
        Write-Host "[DEBUG_LOG] HAS_ROOT_GO_MOD=$has_go_mod"
        Write-Host "[DEBUG_LOG] HAS_ROOT_MAIN_GO=$has_main_go"
        Write-Host "[DEBUG_LOG] HAS_GO_MAIN_PACKAGE=$has_go_main"
        Write-Host "[DEBUG_LOG] JS_RUNTIME=$js_runtime"
        Write-Host "[DEBUG_LOG] JS_FRAMEWORK=$js_framework"
        Write-Host "[DEBUG_LOG] JS_PACKAGE_MANAGER=$js_pm"
        Write-Host "[DEBUG_LOG] HAS_ROOT_CMAKELISTS=$has_cmake"
        Write-Host "[DEBUG_LOG] HAS_ROOT_MKDOCS=$has_mkdocs"
        Write-Host "[DEBUG_LOG] HAS_SUB_NPM=$has_sub_npm"
        Write-Host "[DEBUG_LOG] HAS_SUB_MKDOCS=$has_sub_mkdocs"
        Write-Host "[DEBUG_LOG] PRIMARY_STACK_SUGGESTION=$suggestion"
        "HAS_ROOT_PACKAGE_JSON=$has_root_pkg" >> $Env:GITHUB_OUTPUT
        "HAS_FRONTEND_PACKAGE_JSON=$has_frontend_pkg" >> $Env:GITHUB_OUTPUT
        "HAS_ROOT_GO_MOD=$has_go_mod" >> $Env:GITHUB_OUTPUT
        "HAS_ROOT_MAIN_GO=$has_main_go" >> $Env:GITHUB_OUTPUT
        "HAS_GO_MAIN_PACKAGE=$has_go_main" >> $Env:GITHUB_OUTPUT
        "JS_RUNTIME=$js_runtime" >> $Env:GITHUB_OUTPUT
        "JS_FRAMEWORK=$js_framework" >> $Env:GITHUB_OUTPUT
        "JS_PACKAGE_MANAGER=$js_pm" >> $Env:GITHUB_OUTPUT
        "HAS_ROOT_CMAKELISTS=$has_cmake" >> $Env:GITHUB_OUTPUT
        "HAS_ROOT_MKDOCS=$has_mkdocs" >> $Env:GITHUB_OUTPUT
        "HAS_SUB_NPM=$has_sub_npm" >> $Env:GITHUB_OUTPUT
        "HAS_SUB_MKDOCS=$has_sub_mkdocs" >> $Env:GITHUB_OUTPUT
        "PRIMARY_STACK_SUGGESTION=$suggestion" >> $Env:GITHUB_OUTPUT
        if ($found.Count -gt 0) { "FOUND_FILES=$($found -join ',')" >> $Env:GITHUB_OUTPUT } else { "FOUND_FILES=" >> $Env:GITHUB_OUTPUT }
outputs:
  OS:
    description: "Runner OS (Linux/macOS/Windows)"
    value: ${{ steps.meta_bash.outputs.OS || steps.meta_pwsh.outputs.OS }}
  ARCH:
    description: "CPU architecture (e.g., x86_64/amd64/arm64)"
    value: ${{ steps.meta_bash.outputs.ARCH || steps.meta_pwsh.outputs.ARCH }}
  DISTRO:
    description: "Linux distro version when on Linux (e.g., 20.04/22.04/24.04); empty otherwise"
    value: ${{ steps.linux.outputs.DISTRO }}
  REF:
    description: "The full Git ref"
    value: ${{ steps.meta_bash.outputs.REF || steps.meta_pwsh.outputs.REF }}
  BRANCH:
    description: "Branch name when on branch refs; empty on tags"
    value: ${{ steps.meta_bash.outputs.BRANCH || steps.meta_pwsh.outputs.BRANCH }}
  TAG:
    description: "Tag name when running on a tag ref; empty otherwise"
    value: ${{ steps.meta_bash.outputs.TAG || steps.meta_pwsh.outputs.TAG }}
  IS_TAG:
    description: "1 if running on tag ref; 0 otherwise"
    value: ${{ steps.meta_bash.outputs.IS_TAG || steps.meta_pwsh.outputs.IS_TAG }}
  SHA:
    description: "Full commit SHA"
    value: ${{ steps.meta_bash.outputs.SHA || steps.meta_pwsh.outputs.SHA }}
  SHORT_SHA:
    description: "Short commit SHA (7 chars)"
    value: ${{ steps.meta_bash.outputs.SHORT_SHA || steps.meta_pwsh.outputs.SHORT_SHA }}
  REPO:
    description: "owner/repo"
    value: ${{ steps.meta_bash.outputs.REPO || steps.meta_pwsh.outputs.REPO }}
  OWNER:
    description: "Repository owner"
    value: ${{ steps.meta_bash.outputs.OWNER || steps.meta_pwsh.outputs.OWNER }}
  HAS_ROOT_PACKAGE_JSON:
    description: "1 if package.json at root of working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_ROOT_PACKAGE_JSON || steps.proj_pwsh.outputs.HAS_ROOT_PACKAGE_JSON }}
  HAS_FRONTEND_PACKAGE_JSON:
    description: "1 if frontend/package.json under working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_FRONTEND_PACKAGE_JSON || steps.proj_pwsh.outputs.HAS_FRONTEND_PACKAGE_JSON }}
  HAS_ROOT_GO_MOD:
    description: "1 if go.mod at root of working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_ROOT_GO_MOD || steps.proj_pwsh.outputs.HAS_ROOT_GO_MOD }}
  HAS_ROOT_MAIN_GO:
    description: "1 if main.go at root of working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_ROOT_MAIN_GO || steps.proj_pwsh.outputs.HAS_ROOT_MAIN_GO }}
  HAS_GO_MAIN_PACKAGE:
    description: "1 if the module produces a command — main.go at root, or cmd/*/main.go"
    value: ${{ steps.proj_bash.outputs.HAS_GO_MAIN_PACKAGE || steps.proj_pwsh.outputs.HAS_GO_MAIN_PACKAGE }}
  JS_RUNTIME:
    description: "JavaScript runtime from the lockfile: node, bun, deno, or empty"
    value: ${{ steps.proj_bash.outputs.JS_RUNTIME || steps.proj_pwsh.outputs.JS_RUNTIME }}
  JS_FRAMEWORK:
    description: "Framework marker: angular, astro, next, nuxt, svelte, vite, danet, or empty"
    value: ${{ steps.proj_bash.outputs.JS_FRAMEWORK || steps.proj_pwsh.outputs.JS_FRAMEWORK }}
  JS_PACKAGE_MANAGER:
    description: "Package manager from the lockfile on Node: npm, pnpm, yarn, or empty"
    value: ${{ steps.proj_bash.outputs.JS_PACKAGE_MANAGER || steps.proj_pwsh.outputs.JS_PACKAGE_MANAGER }}
  HAS_ROOT_CMAKELISTS:
    description: "1 if CMakeLists.txt at root of working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_ROOT_CMAKELISTS || steps.proj_pwsh.outputs.HAS_ROOT_CMAKELISTS }}
  HAS_ROOT_MKDOCS:
    description: "1 if mkdocs.yml at root of working-directory"
    value: ${{ steps.proj_bash.outputs.HAS_ROOT_MKDOCS || steps.proj_pwsh.outputs.HAS_ROOT_MKDOCS }}
  HAS_SUB_NPM:
    description: "1 if a nested package.json was found within depth 2"
    value: ${{ steps.proj_bash.outputs.HAS_SUB_NPM || steps.proj_pwsh.outputs.HAS_SUB_NPM }}
  HAS_SUB_MKDOCS:
    description: "1 if a nested mkdocs.yml was found within depth 2"
    value: ${{ steps.proj_bash.outputs.HAS_SUB_MKDOCS || steps.proj_pwsh.outputs.HAS_SUB_MKDOCS }}
  PRIMARY_STACK_SUGGESTION:
    description: "Computed primary stack suggestion (wails3/wails2/go/core/cpp/node/bun/deno/unknown)"
    value: ${{ steps.proj_bash.outputs.PRIMARY_STACK_SUGGESTION || steps.proj_pwsh.outputs.PRIMARY_STACK_SUGGESTION }}
  FOUND_FILES:
    description: "Comma-separated summary of notable files found"
    value: ${{ steps.proj_bash.outputs.FOUND_FILES || steps.proj_pwsh.outputs.FOUND_FILES }}
