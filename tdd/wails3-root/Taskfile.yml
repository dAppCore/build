version: "3"

# A Wails v3 project in the shape the real ones take: the Go module one
# directory down, the frontend beside it, and the build described by the
# project rather than by CLI flags. dAppCore/build's wails3 stack drives this
# through `wails3 build` and `wails3 package`, so this file is what CI actually
# exercises.

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "wails3-fixture"
  BIN_DIR: "bin"
  GO_DIR: "go"
  GO_CMD: "."
  WAILS3_TOOL: '{{.WAILS3_TOOL | default "go tool wails3"}}'

# The root dispatch tasks. `wails3 build` and `wails3 package` run these and
# pass GOOS in, so a project without them answers `task: Task "build" does not
# exist` — which is what this fixture did, having only the per-platform targets
# a `wails3 init` project keeps behind these two. A fixture that a real project
# shape would not reproduce is not testing the stack, so they are here now.
tasks:
  build:
    summary: Builds the application, dispatching on the target OS
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages the application, dispatching on the target OS
    cmds:
      - task: "{{OS}}:package"
