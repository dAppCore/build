name: "Build Action (orchestrated)"
description: "General build action repo; root is minimal and delegates to directory orchestrator based on discovery/ENV"
branding:
  icon: 'box'
  color: 'purple'
inputs:
  build:
    description: "Whether to run the build"
    required: false
    default: "true"
  sign:
    description: "Sign the build (delegated to stack’s signing flow)"
    required: false
    default: "false"
  package:
    description: "Upload artifacts and publish release on tags"
    required: false
    default: "true"
  build-name:
    description: "The name of the binary/app bundle"
    required: true
  build-platform:
    description: "Platform to build for (e.g., linux/amd64, windows/amd64, darwin/universal)"
    required: false
    default: "darwin/universal"
  main-package:
    description: "Package to build; empty auto-detects"
    required: false
    default: ""
  build-tags:
    description: "Comma-separated build tags"
    required: false
    default: ""
  ldflags:
    description: "Passed to -ldflags"
    required: false
    default: ""
  cgo:
    description: "auto, 0 or 1"
    required: false
    default: "auto"
  test:
    description: "auto runs tests when the module has any; true requires them; false skips"
    required: false
    default: "auto"
  coverage:
    description: "Produce a coverage profile"
    required: false
    default: "false"
  codecov:
    description: "Upload coverage to Codecov. Implies coverage."
    required: false
    default: "false"
  codecov-token:
    description: "Codecov token. Public repositories can upload without one."
    required: false
    default: ""
  benchmarks:
    description: "Run benchmarks after the tests"
    required: false
    default: "false"
  go-directory:
    description: "Where the Go module lives, relative to the working directory"
    required: false
    default: ""
  app-working-directory:
    description: "Root of the app being built"
    required: false
    default: "."
  # Orchestrator controls (stack-agnostic)
  AUTO_STACK:
    description: "Allow root action to auto-select a stack based on discovery"
    required: false
    default: "true"
  AUTO_SETUP:
    description: "Allow orchestrators to auto-enable setup tools based on env toggles"
    required: false
    default: "true"
  STACK:
    description: "Explicit stack override (e.g., wails2)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Discovery
      id: discovery
      uses: dAppCore/build/actions/discovery@v4
      with:
        working-directory: ${{ inputs.app-working-directory }}

    - name: Delegate to directory orchestrator
      id: dir_orch
      uses: dAppCore/build/actions@v4
      with:
        build: ${{ inputs.build }}
        sign: ${{ inputs.sign }}
        package: ${{ inputs.package }}
        build-name: ${{ inputs.build-name }}
        build-platform: ${{ inputs.build-platform }}
        app-working-directory: ${{ inputs.app-working-directory }}
        go-directory: ${{ inputs.go-directory }}
        main-package: ${{ inputs.main-package }}
        build-tags: ${{ inputs.build-tags }}
        ldflags: ${{ inputs.ldflags }}
        cgo: ${{ inputs.cgo }}
        test: ${{ inputs.test }}
        coverage: ${{ inputs.coverage }}
        codecov: ${{ inputs.codecov }}
        codecov-token: ${{ inputs.codecov-token }}
        benchmarks: ${{ inputs.benchmarks }}
        AUTO_STACK: ${{ inputs.AUTO_STACK }}
        AUTO_SETUP: ${{ inputs.AUTO_SETUP }}
        STACK: ${{ inputs.STACK }}
        # Pass suggestion from discovery so orchestrator can skip re-scanning if it wants
        PRIMARY_STACK_SUGGESTION: ${{ steps.discovery.outputs.PRIMARY_STACK_SUGGESTION }}

    - name: Debug selected stack
      shell: bash
      run: echo "[DEBUG_LOG] (root) Orchestrator selected stack=${{ steps.dir_orch.outputs.SELECTED_STACK }}"

    # No packaging here. Every stack wrapper packages what it built, because
    # only the stack knows what that is — a binary, a bundle, a dist directory,
    # or in core's case nothing at all. This step used to run as well, so every
    # build through the root action uploaded its artifact twice and, on a tag,
    # attempted the release twice.
outputs:
  SELECTED_STACK:
    description: "Stack selected by the orchestrator (via directory orchestrator)"
    value: ${{ steps.dir_orch.outputs.SELECTED_STACK }}
